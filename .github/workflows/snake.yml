name: GitHub Snake Game

on:
  # Executa diariamente à meia-noite UTC
  schedule:
    - cron: "0 0 * * *"

  # Permite disparo manual
  workflow_dispatch:

  # Também dispara em push no branch main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1️⃣ Checkout do repositório
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      # 2️⃣ Criar pasta temporária para gerar os arquivos
      - name: Prepare temporary folder
        run: |
          rm -rf dist_temp
          mkdir dist_temp

      # 3️⃣ Gerar as animações do Snake na pasta temporária
      - name: Generate GitHub Contributions Snake Animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist_temp/github-snake.svg
            dist_temp/github-snake-dark.svg?palette=github-dark
            dist_temp/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4️⃣ Commit e push para branch temporária usando PAT
      - name: Commit changes to temp branch
        run: |
          TEMP_BRANCH="snake-temp"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B $TEMP_BRANCH
          git add dist_temp
          git commit -m "Update snake animation [skip ci]" || echo "No changes to commit"
          # Configura o remote usando PAT
          git remote set-url origin https://x-access-token:${{ secrets.MY_PAT }}@github.com/${{ github.repository }}.git
          git push --set-upstream origin $TEMP_BRANCH --force
        env:
          MY_PAT: ${{ secrets.MY_PAT }}

      # 5️⃣ Criar Pull Request automático para a branch output
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.MY_PAT }}
          commit-message: "Update snake animation [skip ci]"
          branch: snake-temp
          base: output
          title: "Update GitHub Snake Animations"
          body: "Automated PR to update snake animations."
          labels: automated
          draft: false
