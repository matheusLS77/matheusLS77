name: GitHub Snake Game

on:
  # Executa o workflow diariamente à meia-noite UTC
  schedule:
    - cron: "0 0 * * *"

  # Permite disparo manual
  workflow_dispatch:

  # Também dispara em push no branch main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1️⃣ Checkout do repositório
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false  # evita conflito com o PAT no push

      # 2️⃣ Gera as animações do Snake
      - name: Generate GitHub Contributions Snake Animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3️⃣ Deploy para a branch 'output' usando o PAT
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.MY_PAT }} 
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation [skip ci]"
          force_orphan: true  # cria a branch se ainda não existir
